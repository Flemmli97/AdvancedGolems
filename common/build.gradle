apply from: "https://raw.githubusercontent.com/Flemmli97/GradleScripts/arch-loom-v2/common.gradle"

repositories {
    mavenLocal()
    maven {
        name = "TenshiLib"
        url "https://maven.blazing-coop.net/releases"
    }
}

dependencies {
    modCompileOnly "io.github.flemmli97:tenshilib:${tenshilib_version}-fabric"
}

sourceSets.main.resources {
    srcDir "src/generated/resources"
    copy {
        from project(":common").file("src/generated/resources/assets/advancedgolems/lang")
        into "$sourceSets.main.output.resourcesDir/data/advancedgolems/lang"
    }
}