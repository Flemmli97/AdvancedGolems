apply from: "https://raw.githubusercontent.com/Flemmli97/GradleScripts/arch-loom-v2/neoforge.gradle"

loom {
    runs {
        data {
            data()
            programArgs "--all", "--mod", "advancedgolems"
            programArgs "--output", project(":common").file("src/generated/resources").absolutePath
            programArgs "--existing", project(":common").file("src/main/resources").absolutePath
        }
    }
}

ext {
    mod_meta.tenshilib_version = tenshilib_version
}

dependencies {
    modImplementation "io.github.flemmli97:tenshilib:${tenshilib_version}-neoforge"

    modImplementation "net.tslat.smartbrainlib:SmartBrainLib-neoforge-${project.minecraft_version}:${project.sbl_version}"

    modRuntimeOnly "io.github.flemmli97:debugutils:1.21.1-1.0.7-neoforge"
}