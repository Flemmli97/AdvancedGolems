apply from: "https://raw.githubusercontent.com/Flemmli97/GradleScripts/arch-loom-v2/forge.gradle"

loom {
    runs {
        data {
            data()
            programArgs "--all", "--mod", "advancedgolems"
            programArgs "--output", project(":common").file("src/generated/resources").absolutePath
            programArgs "--existing", project(":common").file("src/main/resources").absolutePath
        }
    }
}

ext {
    mod_meta.tenshilib_version = tenshilib_version
}

repositories {
    mavenLocal()
    maven {
        name = "TenshiLib"
        url "https://maven.blazing-coop.net/releases"
    }
    maven {
        name = "CurseMaven"
        url "https://www.cursemaven.com"
    }
}

dependencies {
    modImplementation "io.github.flemmli97:tenshilib:${tenshilib_version}-forge"

    modRuntimeOnly "curse.maven:mobbattle-268746:5780382"
    modRuntimeOnly "curse.maven:dummy-225738:3820503"
    modRuntimeOnly "curse.maven:spark-361579:3824951"

    modRuntimeOnly "io.github.flemmli97:debugutils:1.18.2-1.0.1-forge"
}